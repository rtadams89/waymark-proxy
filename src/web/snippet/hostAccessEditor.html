<!DOCTYPE html>
<html>
    <head>
        <!-- Notes: This should be open in its original path-->
        <meta charset="utf-8">
        <meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
        <link rel="stylesheet" href="../script/semantic/semantic.min.css">
        <script src="../script/jquery-3.6.0.min.js"></script>
        <script src="../script/semantic/semantic.min.js"></script>
        <script src="../script/utils.js"></script>
        <style>
            /* Custom fork: the ACL of a proxy rule (mod/access) */
            .aclCard{
                cursor: pointer;
                border-radius: 0.4em !important;
                border: 1px solid rgb(233, 233, 233) !important;
                margin: 0 0 0.5em 0 !important;
                position: relative;
            }
            .aclCard:hover, .aclCard.active{
                background-color: rgb(241, 241, 241) !important;
            }
            .aclCard .selected{
                position: absolute;
                top: 1em;
                right: 0.6em;
            }
            .aclCard:not(.active) .selected{
                display: none;
            }
            .aclCard .aclMeta{
                opacity: 0.75;
                font-size: 0.9em;
            }
            #aclList{
                max-height: calc(100vh - 20em);
                min-height: 200px;
                overflow-y: auto;
                padding: 0.2em;
            }
            body.darkTheme .ui.segment.aclCard{
                border: 1px solid var(--theme_bg_secondary) !important;
            }
            body.darkTheme .ui.segment.aclCard:hover, body.darkTheme .ui.segment.aclCard.active{
                background-color: var(--theme_bg_secondary) !important;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="../darktheme.css">
        <script src="../script/darktheme.js"></script>
        <br>
        <div class="ui container">
            <p>Choose the ACL for this rule. Its rules are checked top down for the client's address; an address no rule matches is denied.
                <a href="#" onclick="openACLPage(); return false;">Manage ACLs</a></p>
            <div id="aclList"><small>Loading</small></div>
            <div id="trustBox" style="display:none; margin-top: 1em;">
                <div class="ui divider"></div>
                <div class="ui checkbox">
                    <input type="checkbox" id="trustProxyHeaders">
                    <label>Trust the client address forwarded by trusted proxies<br>
                        <small>When a request comes from an address on <a href="#" onclick="openTrustedProxies(); return false;">Access &gt; Trusted Proxies</a> (a CDN or load balancer in front of Waymark), the ACL, rate limiting and logs use the client address it forwards (X-Forwarded-For and similar). Leave this off when clients connect to Waymark directly.</small></label>
                </div>
            </div>
            <br><br><br>
        </div>
        <script>
            let editingEndpoint = {};
            if (window.location.hash.length > 1){
                try{
                    editingEndpoint = JSON.parse(decodeURIComponent(window.location.hash.substr(1)));
                }catch(ex){
                    console.log("Unable to load endpoint data from hash");
                }
            }
            let isL4 = (editingEndpoint.ept == "l4");
            let currentACL = "allow-all";
            let currentTrust = false;

            function normalizeID(id){
                return (id == "" || id == undefined) ? "allow-all" : id;
            }

            function openACLPage(id){
                if (parent.wmOpenACL){
                    parent.wmOpenACL(id);
                }
            }

            function openTrustedProxies(){
                if (parent.openTabById){
                    if (parent.closeHttpRuleEditor) parent.closeHttpRuleEditor();
                    parent.openTabById("trustproxy");
                }
            }

            function renderACLs(list){
                let box = $("#aclList").empty();
                let known = {};
                list.forEach(function(a){
                    known[a.id] = true;
                    let users = a.users.length == 1 ? "1 proxy rule" : a.users.length + " proxy rules";
                    let rules = a.rules == 1 ? "1 rule" : a.rules + " rules";
                    box.append(`<div class="ui basic segment aclCard" aclid="${htmlEscape(a.id)}" onclick="selectACL(this);">
                        <h5 class="ui header" style="margin-bottom: 0.3em;">
                            <i class="ui ${a.builtIn ? "grey" : "green"} hand paper icon"></i>
                            <div class="content">${htmlEscape(a.name)} ${a.builtIn ? `<span class="ui mini basic label">built in</span>` : ""}</div>
                        </h5>
                        <div class="aclMeta">${htmlEscape(a.description || "")}</div>
                        <div class="aclMeta" style="margin-top: 0.3em;">${rules} · used by ${users}${a.builtIn ? "" : ` · <a href="#" onclick="event.stopPropagation(); openACLPage('${htmlEscape(a.id)}'); return false;">Edit</a>`}</div>
                        <div class="selected"><i class="ui large green check icon"></i></div>
                    </div>`);
                });
                if (!known[currentACL]){
                    // An ACL that no longer exists is treated as Allow all
                    currentACL = "allow-all";
                }
                markActive();
            }

            function markActive(){
                $(".aclCard").removeClass("active");
                $(".aclCard").filter(function(){ return $(this).attr("aclid") == currentACL; }).addClass("active");
            }

            function loadList(){
                $.get("/api/acl/list", function(data){
                    if (data.error != undefined){
                        $("#aclList").text(data.error);
                        return;
                    }
                    renderACLs(data);
                });
            }

            function load(){
                if (isL4){
                    let c = parent.l4CurrentConfig ? parent.l4CurrentConfig() : null;
                    currentACL = normalizeID(c ? c.AccessRuleUUID : "");
                    loadList();
                    return;
                }
                $.cjax({
                    url: "/api/proxy/detail",
                    method: "POST",
                    data: {"type": "host", "epname": editingEndpoint.ep},
                    success: function(d){
                        if (d.error != undefined){
                            $("#aclList").text(d.error);
                            return;
                        }
                        currentACL = normalizeID(d.AccessFilterUUID);
                        currentTrust = !!d.TrustProxyHeaders;
                        $("#trustProxyHeaders").prop("checked", currentTrust);
                        $("#trustBox").show();
                        loadList();
                    }
                });
            }
            load();

            function selectACL(card){
                let id = $(card).attr("aclid");
                if (id == currentACL) return;
                save(id, currentTrust);
            }

            $("#trustProxyHeaders").on("change", function(){
                save(currentACL, this.checked);
            });

            function save(aclID, trust){
                if (isL4){
                    parent.saveL4Config({accessRuleUUID: aclID}, function(err){
                        let c = parent.l4CurrentConfig();
                        currentACL = normalizeID(c ? c.AccessRuleUUID : "");
                        markActive();
                    });
                    return;
                }
                $.cjax({
                    url: "/api/acl/attach",
                    method: "POST",
                    data: {id: aclID, host: editingEndpoint.ep, trust: trust},
                    success: function(data){
                        if (data.error != undefined){
                            parent.msgbox(data.error, false, 6000);
                            $("#trustProxyHeaders").prop("checked", currentTrust);
                            markActive();
                            return;
                        }
                        currentACL = aclID;
                        currentTrust = trust;
                        markActive();
                        parent.msgbox("Access settings updated");
                        if (parent.updateAccessRuleNameUnderHost){
                            parent.updateAccessRuleNameUnderHost(editingEndpoint.ep, aclID);
                        }
                    }
                });
            }
        </script>
    </body>
</html>
