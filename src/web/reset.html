    <body style="display:flex; align-items:center; justify-content:center; height:100vh; background:#f5f5f5;">
        <div style="text-align:center; max-width:480px; padding:2em; background:white; border-radius:1em; box-shadow:0 2px 12px rgba(0,0,0,0.1);">
            <i class="ui large info circle icon" style="color:#2185d0;"></i>
            <h2>Reset an Admin Password</h2>
            <p>Stop Waymark, then set the password at the terminal, in Waymark's folder and as the user it runs as:</p>
            <pre style="background:#f0f0f0; padding:0.8em; border-radius:0.4em; font-size:1em; text-align:left; white-space:pre-wrap;">sudo systemctl stop waymark
cd /opt/waymark
sudo -u waymark ./waymark -set-admin-password
sudo systemctl start waymark</pre>
            <p style="color:grey; font-size:0.9em;">With HA, do this on the active node. <a href="/login.html">Back to sign in</a></p>
        </div>
    </body>
</html>
