<!-- Custom fork: Certificates > DNS Credentials. The credential set manager
     (snippet/dnsProfiles.html) shown in a frame that follows its height. -->
<div class="standardContainer">
    <div class="ui basic segment">
        <h2>DNS Credentials</h2>
        <p>Saved DNS provider credentials for ACME DNS challenges. One credential set can be used by any number of certificates; pick a certificate's set with the key button on Certificates &gt; Installed Certificates.</p>
    </div>
    <iframe id="dnscredsFrame" title="DNS credential sets" style="width: 100%; min-height: 420px; border: 0; display: block;"></iframe>
    <br>
</div>
<script>
    (function(){
        let frame = $("#dnscredsFrame");
        window.addEventListener("message", function(e){
            if (e.origin != window.location.origin || !e.data || e.data.wmFrame != "dnscreds") return;
            frame.css("height", Math.max(420, parseInt(e.data.height) || 0) + "px");
        });
        //Loaded when the page is first opened, and again on later visits (a set
        //may have been added from the ACME tool meanwhile)
        tabSwitchEventBind["dnscreds"] = function(){
            frame.attr("src", "snippet/dnsProfiles.html?page=1");
        };
    })();
</script>
