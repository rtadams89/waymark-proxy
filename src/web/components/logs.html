<!-- Custom fork: Access Logs (script/logpage.js). Log settings are on System > Logging (logsettings.html). -->
<style>
    .lpPage .lpTableWrap{ width: 100%; overflow: auto; max-height: 70vh; border: 1px solid var(--divider_color); border-radius: 0.4em; }
    .lpPage .lpTable{ border: 0 !important; margin: 0 !important; }
    .lpPage .lpTable thead th{ position: sticky; top: 0; z-index: 1; background: var(--theme_bg_primary) !important; }
    .lpPage .lpTable td{ vertical-align: top; }
    .lpPage .lpTime{ white-space: nowrap; font-family: monospace; font-size: 0.85em; opacity: 0.8; }
    .lpPage .lpMono{ font-family: monospace; font-size: 0.9em; }
    .lpPage .lpWrap{ word-break: break-word; }
    .lpPage .lpUA{ max-width: 22em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lpPage tr.lpError td{ background: rgba(219,40,40,0.06); }
    .lpPage .lpCount{ color: var(--text_color_secondary); font-size: 0.9em; margin: 0.4em 0 0.6em 0; }
    .lpPage select{ min-width: 9em; }
    .lpPage .lpTag{ display: inline-block; min-width: 3em; text-align: center; padding: 0.1em 0.5em; border-radius: 0.3em; font-size: 0.8em; font-weight: 600; border: 1px solid currentColor; }
    .lpPage .lpTag.s2{ color: #1a9c3a; } .lpPage .lpTag.s3{ color: #2185d0; } .lpPage .lpTag.s4{ color: #d97706; } .lpPage .lpTag.s5, .lpPage .lpTag.err{ color: #db2828; }
    .lpPage .lpTag.info{ color: var(--text_color_secondary); }
    .lpPage .lpNowrap{ white-space: nowrap; }
</style>
<div class="standardContainer lpPage">
    <div class="ui basic segment">
        <h2>Access Logs</h2>
        <p>One line per HTTP request the proxy handled, newest first, from this node's log file. Where access logs go is set on System &gt; Logging.</p>
    </div>
    <div class="ui message lpNotice" style="display:none;"></div>
    <div class="lpTools"></div>
    <div class="lpCount"></div>
    <div class="lpTableWrap">
        <table class="ui very compact celled unstackable table lpTable"><thead></thead><tbody></tbody></table>
    </div>
    <br>
</div>
<script>
    wmLogPage("#logs", "access");
</script>
