<!-- System > Admin Account -->
<div class="standardContainer">
    <div class="ui basic segment">
        <h2>Admin Account</h2>
        <p>The account you are signed in to this web interface with. Users of Waymark Auth (single sign-on for proxied sites) are managed under Access &gt; SSO.</p>
    </div>
    <div class="ui segment">
        <div class="selfauthOnly">
            <h3>Change Password</h3>
            <p>Change the password of the account you are signed in with.</p>
            <div class="ui basic segment" style="padding-left: 0;">
                <div id="changePasswordForm" class="ui form">
                    <div class="field">
                        <label>Current Password</label>
                        <input type="password" name="oldPassword" placeholder="Current Password">
                    </div>
                    <div class="field">
                        <label>New Password</label>
                        <input type="password" name="newPassword" placeholder="New Password">
                    </div>
                    <div class="field">
                        <label>Confirm New Password</label>
                        <input type="password" name="confirmNewPassword" placeholder="Confirm New Password">
                    </div>
                    <button id="changePasswordBtn" class="ui basic button" onclick="changePassword()"><i class="ui teal key icon"></i> Change Password</button>
                </div>
    
                <div id="passwordChangeSuccMsg" class="ui green message" style="display:none;">
                    <i class="ui circle checkmark green icon "></i> Password Updated
                </div>
            </div>
     </div>
    </div>
    <br>
</div>
<script>
    // The password form is kept until "Change Password" is clicked
    var changePasswordArea = wmTrackChanges("#changePasswordForm", {saveButton: "#changePasswordBtn"});
    setTimeout(function(){ changePasswordArea.reset(); }, 1000);

    /*
        Account Password utilities
    */

    function changePassword() {
        const oldPassword = document.getElementsByName('oldPassword')[0].value;
        const newPassword = document.getElementsByName('newPassword')[0].value;
        const confirmNewPassword = document.getElementsByName('confirmNewPassword')[0].value;
        
        $.cjax({
            type: "POST",
            url: "/api/auth/changePassword",
            data: {
                oldPassword: oldPassword,
                newPassword: newPassword,
                confirmPassword: confirmNewPassword,
            },
            success: function (data) {
                if (data.error != undefined){
                    wmAlert(data.error, null, {error: true});
                }else{
                    $("#passwordChangeSuccMsg").stop().finish().slideDown("fast").delay(3000).slideUp("fast");
                    $('[name="oldPassword"]').val('');
                    $('[name="newPassword"]').val('');
                    $('[name="confirmNewPassword"]').val('');
                    changePasswordArea.reset();
                }
            },
            error: function (xhr, status, error) {
                wmAlert("Error changing password: " + error, null, {error: true});
            },
        });
    }
</script>
