<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Custom fork: Waymark maintenance page. Replace by putting your own
         maintenance.html in <webroot>/templates/ (default ./www/templates/).
         Placeholders: {{host}}, {{message}}, {{retry}} (already HTML-escaped). -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Down for maintenance</title>
    <style>
        :root { --bg: #f4f5f7; --card: #ffffff; --text: #1f2328; --muted: #59636e; --accent: #d97706; --border: #e1e4e8; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #111418; --card: #1b1f24; --text: #e6e8eb; --muted: #9aa4af; --accent: #f59e0b; --border: #2d333b; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: var(--bg); color: var(--text); padding: 24px 16px;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px;
                max-width: 560px; width: 100%; text-align: center; }
        .icon { width: 64px; height: 64px; margin: 0 auto 20px; color: var(--accent); }
        h1 { font-size: 1.6rem; margin: 0 0 12px; font-weight: 600; }
        .message { color: var(--muted); font-size: 1.05rem; line-height: 1.55; margin: 0; overflow-wrap: anywhere; }
        .retry { margin-top: 20px; font-size: 0.95rem; color: var(--muted); }
        .host { margin-top: 28px; font-size: 0.85rem; color: var(--muted); opacity: 0.8; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <div class="card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <h1>Down for maintenance</h1>
        <p class="message">{{message}}</p>
        <p class="retry">{{retry}}</p>
        <div class="host">{{host}}</div>
    </div>
</body>
</html>
