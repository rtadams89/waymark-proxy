# CodeQL settings for Waymark Proxy (used by .github/workflows/codeql.yml).
name: Waymark CodeQL config

paths-ignore:
  # The Zoraxy plugin library (compiled into plugins, not run by Waymark)
  - src/mod/plugins/zoraxy_plugin
  # Vendored, minified third-party UI libraries
  - src/web/script/semantic
  - "**/*.min.js"
