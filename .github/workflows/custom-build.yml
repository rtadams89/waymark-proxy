# Build workflow for the "custom" branch of this fork.
#
# - Every push to custom (or a manual run): vet, test, and build a
#   linux/amd64 binary, uploaded as a workflow artifact (kept 30 days).
# - Pushing a version tag v<base>-custom.<n> (e.g. v3.3.5-custom.1): does the
#   same, then publishes a GitHub Release with the binary and its SHA-256
#   checksum. The tag must match the version compiled into the binary
#   (src/version_custom.go), or the release is refused.
#
# Upstream's ci.yaml only runs on main and pull requests, so it does not
# overlap with this workflow.

name: Custom build

on:
  push:
    branches: [custom]
    tags: ["v*-custom.*"]
  workflow_dispatch:

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # go.mod says "go 1.26.0", which setup-go would install literally.
          # Build with the newest 1.26 patch release so the standard library
          # carries current security fixes.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: src/go.sum

      - name: Verify dependencies
        run: go mod verify
        working-directory: src

      - name: Vet
        run: go vet ./...
        working-directory: src

      - name: Test
        run: go test ./...
        working-directory: src

      # Fails the build if code paths we actually call hit a known
      # vulnerability in a dependency or the standard library.
      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: src

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # go.mod says "go 1.26.0", which setup-go would install literally.
          # Build with the newest 1.26 patch release so the standard library
          # carries current security fixes.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/zoraxy_${GOOS}_${GOARCH}" .
          cd dist
          sha256sum "zoraxy_${GOOS}_${GOARCH}" > "zoraxy_${GOOS}_${GOARCH}.sha256"

      - name: Check version
        working-directory: src/dist
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          # Prints e.g. "Zoraxy - Version 3.3.5-custom.1"
          version="$(./zoraxy_linux_amd64 -version | sed -n 's/^Zoraxy - Version //p')"
          echo "Built version: ${version}"
          echo "Built **Zoraxy ${version}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from the binary"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match the binary version v${version}. Bump FORK_REVISION in src/version_custom.go or fix the tag."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zoraxy_linux_amd64
          path: src/dist/*
          retention-days: 30
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
