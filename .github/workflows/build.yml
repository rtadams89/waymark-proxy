# Waymark Proxy build.
#
# - Every push to main, every pull request into main, and manual runs: vet,
#   test, govulncheck, browser tests of the admin UI (test/ui), and a
#   linux/amd64 build uploaded as a workflow artifact (kept 30 days).
# - Pushing a version tag vMAJOR.MINOR.PATCH (e.g. v1.0.0): the same, then a
#   GitHub Release with the binary and its SHA-256 checksum. The tag must
#   match PRODUCT_VERSION in src/version_custom.go, or the release is refused.

name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Newest 1.26 patch release
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: src/go.sum

      - name: Verify dependencies
        run: go mod verify
        working-directory: src

      - name: Vet
        run: go vet ./...
        working-directory: src

      - name: Test
        run: go test ./...
        working-directory: src

      # Fails the build if code paths we actually call hit a known
      # vulnerability in a dependency or the standard library.
      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: src

  # Browser tests of the admin UI against a fresh instance (test/ui)
  ui:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Newest 1.26 patch release
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: src/go.sum

      - name: Build
        run: go build -o "$RUNNER_TEMP/waymark" .
        working-directory: src

      # Node.js comes with the runner image
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: test/ui

      - name: Start Waymark
        run: |
          mkdir -p "$RUNNER_TEMP/wm"
          cd "$RUNNER_TEMP/wm"
          nohup "$RUNNER_TEMP/waymark" -noauth -port :8000 -mdns=false -default_inbound_port 8443 > waymark.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          echo "::error::Waymark did not start"
          cat waymark.log
          exit 1

      - name: UI tests
        run: npm test
        working-directory: test/ui
        env:
          BASE_URL: http://127.0.0.1:8000

      - name: Upload screenshots and log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-test-failure
          path: |
            test/ui/*.png
            ${{ runner.temp }}/wm/waymark.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Newest 1.26 patch release
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/waymark_${GOOS}_${GOARCH}" .
          cd dist
          sha256sum "waymark_${GOOS}_${GOARCH}" > "waymark_${GOOS}_${GOARCH}.sha256"

      - name: Check version
        working-directory: src/dist
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          # Prints e.g. "Waymark Proxy 1.0.0 (based on Zoraxy 3.3.5)"
          line="$(./waymark_linux_amd64 -version)"
          version="$(echo "$line" | sed -n -E 's/^Waymark Proxy ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p')"
          echo "Built: ${line}"
          echo "Built **${line}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from the binary"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match the binary version v${version}. Set PRODUCT_VERSION in src/version_custom.go or fix the tag."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: waymark_linux_amd64
          path: src/dist/*
          retention-days: 30
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Waymark Proxy $TAG" \
            --generate-notes
