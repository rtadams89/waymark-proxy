# Waymark Proxy: daily check for a new upstream Zoraxy release.
#
# When tobychui/zoraxy publishes a final release (release candidates are
# skipped) that is not merged into main yet, it opens an issue (label
# "upstream-release") and starts the "Merge upstream release" workflow,
# which prepares a pull request. Each release is reported once. See
# .github/scripts/check-upstream.sh.
#
# Needs Issues turned on for the repository (Settings > General > Features).

name: Watch upstream releases

on:
  schedule:
    - cron: "17 14 * * *"  # daily, 07:17 Arizona time
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write  # start the merge workflow
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0  # to tell whether a release is already merged

      - name: Compare with the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-upstream.sh
